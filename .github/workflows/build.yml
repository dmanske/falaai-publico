# Gera os instaladores do FalaAi (sem certificados/segredos: instaladores NÃO assinados).
# Disparo: manual (aba Actions > Build > Run workflow) ou ao enviar uma tag "v*" (ex.: v0.1.0).
# Os arquivos ficam como "artifacts" da execução (aba Actions > a execução > Artifacts).
name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows:
    name: Instalador do Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache do Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            nativo/windows/target
          key: cargo-win-${{ hashFiles('nativo/windows/Cargo.lock') }}

      - name: Testar a lógica do auxiliar do Windows
        working-directory: nativo/windows
        run: cargo test --locked

      - name: Compilar o auxiliar do Windows
        run: npm run nativo:win

      - name: Compilar o app
        run: npm run build

      - name: Empacotar o instalador (NSIS)
        run: npx electron-builder --win --x64 --publish never

      - name: Enviar o instalador
        uses: actions/upload-artifact@v4
        with:
          name: FalaAi-Windows
          path: release/FalaAi-Setup-*.exe
          if-no-files-found: error

  macos:
    name: App do Mac (dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Compilar o app e o auxiliar do Mac
        run: |
          npm run build
          npm run nativo:mac

      - name: Empacotar (dmg, assinatura ad-hoc)
        run: npx electron-builder --mac --publish never

      - name: Enviar o dmg
        uses: actions/upload-artifact@v4
        with:
          name: FalaAi-Mac
          path: release/*.dmg
          if-no-files-found: error
