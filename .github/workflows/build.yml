# Gera os instaladores do FalaAi (sem certificados/segredos: instaladores NÃO assinados).
# Disparo: manual (aba Actions > Build > Run workflow) ou ao enviar uma tag "v*" (ex.: v0.1.0).
# Em tags v*, publica os instaladores no GitHub Releases. Artifacts temporários expiram em 3 dias.
name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Instalador do Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache do Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            nativo/windows/target
          key: cargo-win-${{ hashFiles('nativo/windows/Cargo.lock') }}

      - name: Testar a lógica do auxiliar do Windows
        working-directory: nativo/windows
        run: cargo test --locked

      - name: Compilar o auxiliar do Windows
        run: npm run nativo:win

      - name: Compilar o app
        run: npm run build

      - name: Empacotar o instalador (NSIS)
        run: npx electron-builder --win --x64 --publish never

      - name: Enviar o instalador
        uses: actions/upload-artifact@v4
        with:
          name: FalaAi-Windows
          path: release/FalaAi-Setup-*.exe
          if-no-files-found: error
          retention-days: 3

  macos:
    name: App do Mac (dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Compilar o app e o auxiliar do Mac
        run: |
          npm run build
          npm run nativo:mac

      - name: Empacotar (dmg, assinatura ad-hoc)
        run: npx electron-builder --mac --publish never

      - name: Enviar o dmg
        uses: actions/upload-artifact@v4
        with:
          name: FalaAi-Mac
          path: release/*.dmg
          if-no-files-found: error
          retention-days: 3

  release:
    name: Publicar instaladores no Releases
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Baixar instaladores gerados
        uses: actions/download-artifact@v4
        with:
          pattern: FalaAi-*
          path: release
          merge-multiple: true

      - name: Conferir instaladores
        run: |
          ls -lh release/
          test -n "$(find release -maxdepth 1 -type f -name '*.exe' -print -quit)"
          test -n "$(find release -maxdepth 1 -type f -name '*.dmg' -print -quit)"

      - name: Publicar versao para download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.exe release/*.dmg \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "FalaAi $GITHUB_REF_NAME" \
            --generate-notes
