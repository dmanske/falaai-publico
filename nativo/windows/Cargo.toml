[package]
name = "falaai-auxiliar-win"
version = "0.1.0"
edition = "2021"
description = "Auxiliar nativo do FalaAi para Windows (protocolo v2): teclado global, colar, contexto, som."
publish = false

[[bin]]
name = "falaai-auxiliar-win"
path = "src/main.rs"

[dependencies]
serde_json = "1"

# A API do Windows só entra quando o alvo é Windows (no Mac só roda a lógica pura e os testes).
[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Accessibility",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
