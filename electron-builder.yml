# Empacotamento do FalaAi (electron-builder).
#   Mac:     npm run empacotar:mac   -> release/mac-arm64/FalaAi.app e release/*.dmg
#   Windows: npm run empacotar:win   -> release/FalaAi-Setup-<versão>.exe (feito no GitHub Actions)
# Os ícones saem de build/icon.png (gerado por: swift scripts/gerar-icone-app.swift).
appId: com.manske.falaai
productName: FalaAi
copyright: Copyright © Daniel Manske
directories:
  output: release
  buildResources: build

# Mac: depois da assinatura ad-hoc, assina de novo com o certificado local "FalaAi Local", para o macOS
# manter as permissões entre versões (scripts/assinar-mac.cjs; criar o certificado uma vez com
# scripts/criar-assinatura-mac.sh).
afterSign: scripts/assinar-mac.cjs

files:
  - out/**
  - package.json

# O código lê esses arquivos na RAIZ de Resources (src/main/lib/recursos.ts):
#   Resources/amostra-teste.wav, Resources/iconeBandejaTemplate.png, Resources/bin/<auxiliar>
# Cada sistema leva só o seu auxiliar nativo.
mac:
  category: public.app-category.productivity
  icon: build/icon.png
  # Um pacote para cada tipo de Mac: arm64 (chip Apple, M1 em diante) e x64 (Intel). O auxiliar
  # nativo já é universal (scripts/compilar-auxiliar-mac.sh), então serve para os dois.
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: dir
      arch: [arm64, x64]
  # Assinatura "ad-hoc" ("-") primeiro; o afterSign troca pela do certificado local quando ele existe.
  identity: "-"
  hardenedRuntime: false
  gatekeeperAssess: false
  extendInfo:
    NSMicrophoneUsageDescription: O FalaAi usa o microfone para ouvir o seu ditado.
  extraResources:
    - from: resources
      to: .
      filter:
        - "**/*"
        - "!bin/*.exe"

dmg:
  title: FalaAi
  artifactName: FalaAi-${version}-${arch}.${ext}

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: x64
  artifactName: FalaAi-Setup-${version}.${ext}
  extraResources:
    - from: resources
      to: .
      filter:
        - "**/*"
        - "!bin/falaai-auxiliar-mac"

nsis:
  oneClick: true
  perMachine: false
  createStartMenuShortcut: true
  createDesktopShortcut: false
  deleteAppDataOnUninstall: false
